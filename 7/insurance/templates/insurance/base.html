<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Страховая компания{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            ink: "#14211b",
                            leaf: "#315b47",
                            clay: "#bd5a3b",
                            sand: "#f7efe3"
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="min-h-screen bg-gradient-to-br from-stone-100 via-brand-sand to-emerald-50 text-brand-ink antialiased">
    <div class="pointer-events-none fixed inset-0 -z-10 overflow-hidden">
        <div class="absolute -left-24 top-8 h-80 w-80 rounded-full bg-brand-clay/20 blur-3xl"></div>
        <div class="absolute right-0 top-40 h-96 w-96 rounded-full bg-brand-leaf/15 blur-3xl"></div>
    </div>

    <header class="mx-auto flex w-full max-w-7xl flex-col gap-6 px-5 py-6 md:flex-row md:items-center md:justify-between lg:px-8">
        <a href="{% url 'insurance:policy-list' %}" class="group">
            <h1 class="text-3xl font-black tracking-tight text-brand-ink md:text-4xl">Страховая компания</h1>
        </a>
        <nav class="flex flex-wrap gap-2 rounded-full border border-white/70 bg-white/70 p-2 shadow-sm backdrop-blur">
            <a class="rounded-full px-4 py-2 text-sm font-semibold text-brand-ink transition hover:bg-brand-ink hover:text-white" href="{% url 'insurance:policy-list' %}">Полисы</a>
            <a class="rounded-full px-4 py-2 text-sm font-semibold text-brand-ink transition hover:bg-brand-ink hover:text-white" href="{% url 'insurance:clients' %}">Клиенты</a>
            <a class="rounded-full px-4 py-2 text-sm font-semibold text-brand-ink transition hover:bg-brand-ink hover:text-white" href="{% url 'insurance:products' %}">Продукты</a>
            <a class="rounded-full px-4 py-2 text-sm font-semibold text-brand-ink transition hover:bg-brand-ink hover:text-white" href="{% url 'insurance:claims' %}">Случаи</a>
            <a class="rounded-full bg-brand-clay px-4 py-2 text-sm font-semibold text-white shadow-sm transition hover:bg-brand-ink" href="/admin/">Админка</a>
        </nav>
    </header>

    <main class="mx-auto w-full max-w-7xl px-5 pb-14 lg:px-8">
        {% if messages %}
            <div class="mb-5 rounded-2xl bg-brand-leaf px-5 py-4 text-sm font-semibold text-white shadow-lg shadow-stone-900/10">
                {% for message in messages %}
                    <p>{{ message }}</p>
                {% endfor %}
            </div>
        {% endif %}

        {% block content %}{% endblock %}
    </main>
</body>
</html>
