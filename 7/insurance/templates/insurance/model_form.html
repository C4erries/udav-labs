{% extends "insurance/base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<section class="mx-auto max-w-3xl rounded-[1.5rem] border border-white/70 bg-white/85 p-6 shadow-xl shadow-stone-900/5">
    <h2 class="text-4xl font-black tracking-tight">{{ title }}</h2>

    <form class="mt-6 grid gap-5" method="post">
        {% csrf_token %}
        {{ form.non_field_errors }}

        {% for field in form %}
            <label class="grid gap-2 text-sm font-bold text-stone-600">
                <span>{{ field.label }}</span>
                {{ field }}
                {% if field.errors %}
                    <span class="text-sm font-semibold text-red-700">{{ field.errors|striptags }}</span>
                {% endif %}
            </label>
        {% endfor %}

        <button class="rounded-full bg-brand-clay px-5 py-3 text-sm font-bold text-white transition hover:bg-brand-ink" type="submit">{{ submit_label|default:"Сохранить" }}</button>
    </form>
</section>
{% endblock %}
