{% extends "base.html" %}

{% block title %}Новый клиент{% endblock %}

{% block content %}
<section class="mx-auto max-w-2xl rounded-[1.5rem] border border-white/70 bg-white/85 p-6 shadow-xl shadow-stone-900/5">
    <h2 class="text-4xl font-black tracking-tight">Добавить клиента</h2>

    <form class="mt-6 grid gap-5" method="post" action="/clients/new">
        <label class="grid gap-2 text-sm font-bold text-stone-600">
            ФИО
            <input class="rounded-2xl border border-stone-200 bg-white px-4 py-3 text-brand-ink outline-none ring-brand-clay/20 transition focus:ring-4" name="full_name" type="text" required>
        </label>
        <label class="grid gap-2 text-sm font-bold text-stone-600">
            Телефон
            <input class="rounded-2xl border border-stone-200 bg-white px-4 py-3 text-brand-ink outline-none ring-brand-clay/20 transition focus:ring-4" name="phone" type="text" required>
        </label>
        <label class="grid gap-2 text-sm font-bold text-stone-600">
            Email
            <input class="rounded-2xl border border-stone-200 bg-white px-4 py-3 text-brand-ink outline-none ring-brand-clay/20 transition focus:ring-4" name="email" type="email" required>
        </label>
        <label class="grid gap-2 text-sm font-bold text-stone-600">
            Дата рождения
            <input class="rounded-2xl border border-stone-200 bg-white px-4 py-3 text-brand-ink outline-none ring-brand-clay/20 transition focus:ring-4" name="birth_date" type="date" required>
        </label>
        <button class="rounded-full bg-brand-clay px-5 py-3 text-sm font-bold text-white transition hover:bg-brand-ink" type="submit">Сохранить</button>
    </form>
</section>
{% endblock %}
